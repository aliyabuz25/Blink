<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#1f2c24" />
      <stop offset="60%" stop-color="#0f1612" />
      <stop offset="100%" stop-color="#070a08" />
    </radialGradient>

    <!-- Head Gradient (Dark Titanium Metal) -->
    <linearGradient id="headGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a4249" />
      <stop offset="50%" stop-color="#242b31" />
      <stop offset="100%" stop-color="#151a1e" />
    </linearGradient>

    <!-- Visor Glass Gradient -->
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c1215" />
      <stop offset="100%" stop-color="#05080a" />
    </linearGradient>

    <!-- Blink Emerald Glow -->
    <linearGradient id="eyeGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22ec80" />
      <stop offset="100%" stop-color="#07c160" />
    </linearGradient>

    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle with Subtle Ring -->
  <circle cx="128" cy="128" r="126" fill="url(#bgGrad)" stroke="#07c160" stroke-width="2.5" stroke-opacity="0.35" />

  <!-- Robot Ears / Antennas -->
  <!-- Left Ear -->
  <rect x="36" y="106" width="14" height="38" rx="7" fill="#2d353c" stroke="#1b2126" stroke-width="2" />
  <circle cx="43" cy="125" r="3.5" fill="#07c160" filter="url(#subtleGlow)" />
  <!-- Right Ear -->
  <rect x="206" y="106" width="14" height="38" rx="7" fill="#2d353c" stroke="#1b2126" stroke-width="2" />
  <circle cx="213" cy="125" r="3.5" fill="#07c160" filter="url(#subtleGlow)" />

  <!-- Robot Head Exterior -->
  <rect x="46" y="60" width="164" height="136" rx="42" fill="url(#headGrad)" stroke="#4a555f" stroke-width="1.5" />

  <!-- Head Top Antenna / Node -->
  <rect x="122" y="38" width="12" height="24" rx="4" fill="#303840" />
  <circle cx="128" cy="38" r="9" fill="#07c160" filter="url(#neonBlur)" opacity="0.9" />
  <circle cx="128" cy="38" r="5" fill="#8affc1" />

  <!-- Visor Bezel / Inset -->
  <rect x="58" y="76" width="140" height="96" rx="30" fill="#0d1115" stroke="#1f262d" stroke-width="2" />

  <!-- Visor Curved Glass -->
  <rect x="62" y="80" width="132" height="88" rx="26" fill="url(#visorGrad)" />

  <!-- Visor Top Glass Highlight (Gloss reflection) -->
  <path d="M 68 84 Q 128 92 188 84 A 20 20 0 0 1 190 98 Q 128 106 66 98 A 20 20 0 0 1 68 84 Z" fill="white" opacity="0.08" />

  <!-- Expressive Friendly Glowing Eyes -->
  <!-- Left Eye -->
  <g filter="url(#neonBlur)">
    <rect x="84" y="108" width="28" height="34" rx="14" fill="url(#eyeGlow)" />
    <!-- Highlight shine -->
    <circle cx="91" cy="116" r="4.5" fill="white" opacity="0.9" />
  </g>

  <!-- Right Eye -->
  <g filter="url(#neonBlur)">
    <rect x="144" y="108" width="28" height="34" rx="14" fill="url(#eyeGlow)" />
    <!-- Highlight shine -->
    <circle cx="151" cy="116" r="4.5" fill="white" opacity="0.9" />
  </g>

  <!-- Friendly Smile / Voice Wave Indicator -->
  <path d="M 112 152 Q 128 160 144 152" stroke="#07c160" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.85" filter="url(#subtleGlow)" />

  <!-- Subtle Cheeks Glow -->
  <circle cx="76" cy="136" r="5" fill="#07c160" opacity="0.35" filter="url(#neonBlur)" />
  <circle cx="180" cy="136" r="5" fill="#07c160" opacity="0.35" filter="url(#neonBlur)" />

  <!-- Bot Neck Collar -->
  <rect x="96" y="196" width="64" height="14" rx="6" fill="#20272d" stroke="#161c20" stroke-width="1.5" />
</svg>