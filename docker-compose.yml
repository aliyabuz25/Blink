services:
  blink-backend:
    container_name: blink-backend
    build:
      context: .
      dockerfile: Dockerfile
    image: blink-backend:latest
    pull_policy: build
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      PORT: "3000"
      NODE_ENV: "production"
      JWT_SECRET: "change_this_to_a_long_random_secret_min_32_chars"
      SITE_URL: "https://blink.octotech.az"
      ALLOWED_ORIGINS: "https://blink.octotech.az,http://blink.octotech.az,https://blink.octotechaz,http://blink.octotechaz"
      DATABASE_URL: "postgres://blink_user:blink_secure_pass_2026@blink-postgres:5432/blink_db"
      UPLOADS_DIR: "/app/uploads"
    volumes:
      - /datastore/blink/uploads:/app/uploads
    networks:
      - edge
      - octobot-net
    depends_on:
      blink-postgres:
        condition: service_healthy
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=edge'
      - 'traefik.http.routers.blink.rule=Host(`blink.octotech.az`) || Host(`blink.octotechaz`)'
      - 'traefik.http.routers.blink.entrypoints=web,websecure'
      - 'traefik.http.routers.blink.tls=true'
      - 'traefik.http.services.blink.loadbalancer.server.port=3000'

  blink-postgres:
    container_name: blink-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: blink_user
      POSTGRES_PASSWORD: blink_secure_pass_2026
      POSTGRES_DB: blink_db
    volumes:
      - /datastore/blink/postgres_data:/var/lib/postgresql/data
    networks:
      - octobot-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blink_user -d blink_db"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  edge:
    external: true
  octobot-net:
    external: true
